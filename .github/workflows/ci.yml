name: Java CI

on:
    push:
        branches:
            - master

jobs:
    build-test-format:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Java 25
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 25

            - name: Make gradlew executable
              run: chmod +x ./gradlew

            - name: Build project
              run: ./gradlew build

            - name: Run tests
              run: ./gradlew test

            - name: Check formatting
              run: ./gradlew spotlessCheck
